[project]
name = "ammonia-loop-teaching-app"
version = "0.1.0"
description = "Interactive Streamlit teaching app for ammonia synthesis loop material balances and techno-economics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

